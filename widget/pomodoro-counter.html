<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg:#f7f6f3;--bg:#ffffff;--bg2:#f1efe8;--border:rgba(55,53,47,0.09);
    --t1:#2f2c27;--t2:#6b665c;--t3:#9b968b;
    --accent:#ff8f5a;--accent-2:#ffe1d2;--accent-soft:rgba(255,143,90,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--page-bg)}
  body{font-family:'DM Sans',sans-serif;background:var(--page-bg);color:var(--t1);padding:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .widget-grid{max-width:860px;margin:0 auto}
  .page-tools{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .widget-shell{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:18px 16px;box-shadow:0 10px 30px rgba(15,15,15,0.04)}
  .widget-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
  .widget-title{font-size:16px;line-height:1.2;font-weight:600;color:var(--t1)}
  .widget-sub{font-size:11px;line-height:1.4;color:var(--t2)}
  .widget-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .theme-toggle{display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--bg2)}
  .theme-btn{border:none;background:transparent;color:var(--t2);font:inherit;font-size:10px;padding:5px 9px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .theme-btn.active{background:var(--bg);color:var(--t1);box-shadow:0 1px 2px rgba(15,15,15,0.08)}
  .copy-btn{background:var(--bg2);border:1px solid var(--border);color:var(--t1);font:inherit;font-size:11px;padding:7px 10px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
  .copy-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--bg2) 80%, var(--accent) 20%)}
  .copy-btn:active{transform:scale(.98)}
  .copy-status{font-size:10px;color:var(--t3);min-width:48px;text-align:right}
  .embed-mode .page-tools{display:none}
  .embed-mode .widget-grid{max-width:none}
  .timer-card{display:flex;flex-direction:column;gap:12px}
  .chip-row{display:flex;justify-content:center;align-items:center;align-content:center;gap:8px;flex-wrap:wrap;width:fit-content;max-width:100%;margin:0 auto}
  .chip{border:1px solid var(--border);background:var(--bg2);color:var(--t2);font:inherit;font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .custom-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .custom-input{width:78px;border:1px solid var(--border);background:var(--bg);color:var(--t1);font:inherit;font-size:12px;padding:6px 10px;border-radius:999px;outline:none;flex:0 0 auto;text-align:center}
  .custom-input:focus{border-color:var(--accent)}
  .timer-core{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,var(--bg2),var(--accent-soft))}
  .timer-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
  .timer-value{font-family:'DM Mono',monospace;font-size:42px;line-height:1;font-weight:500;color:var(--t1)}
  .timer-state{font-size:11px;color:var(--t2)}
  .control-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .control-btn{border:1px solid var(--border);background:var(--bg);color:var(--t1);font:inherit;font-size:11px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:transform .1s,border-color .2s,background .2s}
  .control-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .control-btn:hover{border-color:var(--accent)}
  .control-btn:active{transform:scale(.98)}
  @media (max-width:640px){
    body{padding:10px}
    .widget-shell{padding:14px 12px}
    .page-tools{flex-direction:column;align-items:stretch}
    .widget-actions{justify-content:space-between}
    .copy-status{text-align:left}
    .timer-value{font-size:36px}
  }
  body.embed-mode{padding:4px}
  .embed-mode .widget-shell{padding:12px 10px;box-shadow:none}
  .embed-mode .timer-card{gap:8px}
  .embed-mode .chip-row{gap:6px}
  .embed-mode .chip{font-size:10px;padding:4px 8px}
  .embed-mode .custom-input{width:64px;font-size:11px;padding:4px 8px}
  .embed-mode .timer-core{padding:10px 8px 8px;border-radius:14px;gap:6px}
  .embed-mode .timer-label{font-size:9px;letter-spacing:.12em}
  .embed-mode .timer-value{font-size:32px}
  .embed-mode .timer-state{font-size:10px}
  .embed-mode .control-row{gap:6px}
  .embed-mode .control-btn{font-size:10px;padding:6px 10px}
</style>
</head>
<body>
<main class="widget-grid">
  <div class="page-tools">
    <div class="widget-meta">
      <h1 class="widget-title">Pomodoro Timer</h1>
      <p class="widget-sub">Focus countdown timer.</p>
    </div>
    <div class="widget-actions">
      <div class="theme-toggle">
        <button class="theme-btn" type="button" data-theme="light">light</button>
        <button class="theme-btn" type="button" data-theme="dark">dark</button>
      </div>
      <button class="copy-btn" id="copyBtn">copy widget link</button>
      <span class="copy-status" id="copyStatus"></span>
    </div>
  </div>
  <section class="widget-shell">
    <div class="timer-card">
      <div class="chip-row">
        <button class="chip active" type="button" data-minutes="25">25 min</button>
        <button class="chip" type="button" data-minutes="35">35 min</button>
        <button class="chip" type="button" data-minutes="45">45 min</button>
        <input class="custom-input" id="customMinutes" type="number" min="1" max="240" step="1" value="25" placeholder="min" aria-label="Custom minutes">
      </div>
      <div class="timer-core">
        <div class="timer-label">Focus Session</div>
        <div class="timer-value" id="timerValue">25:00</div>
        <div class="timer-state" id="timerState">ready to start</div>
      </div>
      <div class="control-row">
        <button class="control-btn primary" id="startBtn" type="button">start</button>
        <button class="control-btn" id="pauseBtn" type="button">pause</button>
        <button class="control-btn" id="resetBtn" type="button">reset</button>
      </div>
    </div>
  </section>
</main>
<script>
var STORAGE_KEY='pomodoro_timer_preset';
var SELECTED_THEME='light';
var remainingSeconds=25*60;
var selectedMinutes=25;
var timerId=null;
var THEMES={
  light:{pageBg:'#f7f6f3',bg:'#ffffff',bg2:'#f1efe8',border:'rgba(55,53,47,0.09)',t1:'#2f2c27',t2:'#6b665c',t3:'#9b968b',accent:'#ff8f5a',accent2:'#ffe1d2',accentSoft:'rgba(255,143,90,0.10)'},
  dark:{pageBg:'#191919',bg:'#191919',bg2:'#202020',border:'rgba(255,255,255,0.06)',t1:'#e3e3e1',t2:'#9b9a97',t3:'#5a5a5a',accent:'#ff8f5a',accent2:'rgba(255,143,90,0.08)',accentSoft:'rgba(255,143,90,0.04)'}
};
function css(name,value){document.documentElement.style.setProperty(name,value)}
function themeChoice(){
  var q=new URLSearchParams(window.location.search).get('theme');
  if(q==='light'||q==='dark')return q;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function syncThemeButtons(){
  document.querySelectorAll('.theme-btn').forEach(function(btn){btn.classList.toggle('active',btn.dataset.theme===SELECTED_THEME);});
}
function setThemeQuery(theme){
  var params=new URLSearchParams(window.location.search);
  params.set('theme',theme);
  var query=params.toString();
  history.replaceState(null,'',window.location.pathname+(query?'?'+query:''));
}
function applyTheme(theme){
  var active=THEMES[theme||themeChoice()]||THEMES.light;
  SELECTED_THEME=theme||themeChoice();
  css('--page-bg',active.pageBg);
  css('--bg',active.bg);
  css('--bg2',active.bg2);
  css('--border',active.border);
  css('--t1',active.t1);
  css('--t2',active.t2);
  css('--t3',active.t3);
  css('--accent',active.accent);
  css('--accent-2',active.accent2);
  css('--accent-soft',active.accentSoft);
  syncThemeButtons();
}
function isEmbedMode(){
  var q=new URLSearchParams(window.location.search).get('embed');
  if(q==='1'||q==='true')return true;
  try{return window.self!==window.top;}catch(e){return true;}
}
function applyEmbedMode(){
  if(isEmbedMode())document.body.classList.add('embed-mode');
}
function copyStatus(msg){
  var el=document.getElementById('copyStatus');
  el.textContent=msg;
  window.clearTimeout(copyStatus.t);
  copyStatus.t=window.setTimeout(function(){el.textContent='';},1800);
}
function currentWidgetUrl(){
  var params=new URLSearchParams(window.location.search);
  params.set('embed','1');
  params.set('theme',SELECTED_THEME);
  var query=params.toString();
  return window.location.origin+window.location.pathname+(query?'?'+query:'');
}
function copyLink(){
  var text=currentWidgetUrl();
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){copyStatus('widget link copied');},function(){copyStatus('copy failed');});
    return;
  }
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='absolute';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');copyStatus('widget link copied');}
  catch(e){copyStatus('copy failed');}
  document.body.removeChild(ta);
}
function formatTime(total){
  var mins=Math.floor(total/60);
  var secs=total%60;
  return String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
}
function setState(text){
  document.getElementById('timerState').textContent=text;
}
function renderTime(){
  document.getElementById('timerValue').textContent=formatTime(remainingSeconds);
}
function stopTimer(){
  if(timerId!==null){window.clearInterval(timerId);timerId=null;}
}
function savePreset(){
  localStorage.setItem(STORAGE_KEY,String(selectedMinutes));
}
function syncPresetButtons(){
  document.querySelectorAll('.chip[data-minutes]').forEach(function(btn){btn.classList.toggle('active',Number(btn.dataset.minutes)===selectedMinutes);});
}
function syncCustomInput(){
  document.getElementById('customMinutes').value=String(selectedMinutes);
}
function setPreset(minutes){
  selectedMinutes=minutes;
  remainingSeconds=minutes*60;
  savePreset();
  syncPresetButtons();
  syncCustomInput();
  renderTime();
  setState('ready to start');
}
function loadPreset(){
  var raw=parseInt(localStorage.getItem(STORAGE_KEY)||'25',10);
  selectedMinutes=Number.isFinite(raw)&&raw>0?raw:25;
  remainingSeconds=selectedMinutes*60;
}
function startTimer(){
  if(timerId!==null)return;
  setState('focus running');
  timerId=window.setInterval(function(){
    if(remainingSeconds<=0){
      stopTimer();
      setState('session complete');
      return;
    }
    remainingSeconds-=1;
    renderTime();
    if(remainingSeconds===0){
      stopTimer();
      setState('session complete');
    }
  },1000);
}
function pauseTimer(){
  if(timerId===null)return;
  stopTimer();
  setState('paused');
}
function resetTimer(){
  stopTimer();
  remainingSeconds=selectedMinutes*60;
  renderTime();
  setState('ready to start');
}
document.getElementById('copyBtn').onclick=copyLink;
document.querySelectorAll('.theme-btn').forEach(function(btn){
  btn.onclick=function(){
    SELECTED_THEME=btn.dataset.theme;
    setThemeQuery(SELECTED_THEME);
    applyTheme(SELECTED_THEME);
  };
});
document.querySelectorAll('.chip[data-minutes]').forEach(function(btn){
  btn.onclick=function(){
    stopTimer();
    setPreset(Number(btn.dataset.minutes));
  };
});
function applyCustomMinutes(){
  var value=parseInt(document.getElementById('customMinutes').value,10);
  if(!Number.isFinite(value)||value<1)return;
  stopTimer();
  setPreset(Math.min(value,240));
}
document.getElementById('customMinutes').addEventListener('change',applyCustomMinutes);
document.getElementById('customMinutes').addEventListener('keydown',function(event){if(event.key==='Enter')applyCustomMinutes();});
document.getElementById('startBtn').onclick=startTimer;
document.getElementById('pauseBtn').onclick=pauseTimer;
document.getElementById('resetBtn').onclick=resetTimer;
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!new URLSearchParams(window.location.search).get('theme'))applyTheme();});
}
applyEmbedMode();
loadPreset();
syncPresetButtons();
syncCustomInput();
applyTheme();
renderTime();
setState('ready to start');
(function(){function sendHeight(){var h=document.documentElement.scrollHeight;window.parent.postMessage({widgetHeight:h,src:location.pathname},'*');}sendHeight();new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true,attributes:true});window.addEventListener('resize',sendHeight);})();
</script>
</body>
</html>
