<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg:#f7f6f3;--bg:#ffffff;--bg2:#f1efe8;--border:rgba(55,53,47,0.09);
    --t1:#2f2c27;--t2:#6b665c;--t3:#9b968b;
    --accent:#caef72;--easy:#7cbf65;--medium:#ffb347;--hard:#ff6f61;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--page-bg)}
  body{font-family:'DM Sans',sans-serif;background:var(--page-bg);color:var(--t1);padding:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .widget-grid{max-width:860px;margin:0 auto}
  .page-tools{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .widget-shell{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,15,15,0.04)}
  .widget-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
  .widget-title{font-size:16px;line-height:1.2;font-weight:600;color:var(--t1)}
  .widget-sub{font-size:11px;line-height:1.45;color:var(--t2);max-width:34ch}
  .widget-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .theme-toggle{display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--bg2)}
  .theme-btn{border:none;background:transparent;color:var(--t2);font:inherit;font-size:10px;padding:5px 9px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  .theme-btn.active{background:var(--bg);color:var(--t1);box-shadow:0 1px 2px rgba(15,15,15,0.08)}
  .copy-btn{background:var(--bg2);border:1px solid var(--border);color:var(--t1);font:inherit;font-size:11px;padding:7px 10px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
  .copy-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--bg2) 84%, var(--accent) 16%)}
  .copy-btn:active{transform:scale(.98)}
  .copy-status{font-size:10px;color:var(--t3);min-width:48px;text-align:right}
  .embed-mode .page-tools{display:none}
  .embed-mode .widget-grid{max-width:none}
  body.embed-mode{padding:0}
  .stack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .row{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,var(--bg),var(--bg2));min-width:0}
  .row-copy{display:flex;align-items:center;gap:8px;min-width:0}
  .badge{width:10px;height:10px;border-radius:999px;flex-shrink:0}
  .badge.easy{background:var(--easy)}
  .badge.medium{background:var(--medium)}
  .badge.hard{background:var(--hard)}
  .row-title{font-size:13px;font-weight:600;color:var(--t1)}
  .row-sub{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
  .row-controls{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .count{font-family:'DM Mono',monospace;font-size:26px;line-height:1;color:var(--t1);min-width:2ch;text-align:center}
  .controls{display:flex;gap:6px;flex-shrink:0}
  .btn-small{width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--t1);font-size:20px;cursor:pointer;transition:transform .1s,border-color .2s,background .2s}
  .btn-small:hover{border-color:var(--accent);background:var(--bg2)}
  .btn-small:active{transform:scale(.97)}
  .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .total{font-size:11px;color:var(--t2)}
  .reset-btn{background:none;border:none;color:var(--t3);font:inherit;font-size:10px;cursor:pointer}
  .reset-btn:hover{color:var(--t1)}
  .embed-mode .widget-shell{padding:10px 8px;border-radius:16px}
  .embed-mode .stack{gap:4px}
  .embed-mode .row{gap:6px;padding:8px 6px;border-radius:14px}
  .embed-mode .row-copy{gap:6px}
  .embed-mode .badge{width:9px;height:9px}
  .embed-mode .row-title{font-size:11px}
  .embed-mode .row-sub{font-size:8px;letter-spacing:.07em}
  .embed-mode .count{font-size:20px}
  .embed-mode .controls{gap:4px}
  .embed-mode .btn-small{width:28px;height:28px;border-radius:10px;font-size:18px}
  .embed-mode .footer{margin-top:8px}
  .embed-mode .total,.embed-mode .reset-btn{font-size:9px}
  @media (max-width:640px){
    body{padding:10px}
    .widget-shell{padding:14px 12px}
    .page-tools{flex-direction:column;align-items:stretch}
    .widget-actions{justify-content:space-between}
    .copy-status{text-align:left}
    .stack{grid-template-columns:1fr}
    .row{gap:10px}
    .embed-mode .stack{grid-template-columns:repeat(3,minmax(0,1fr))}
    .embed-mode .row{gap:8px;padding:9px 7px}
  }
  @media (max-width:430px){
    .embed-mode .stack{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<main class="widget-grid">
  <div class="page-tools">
    <div class="widget-meta">
      <h1 class="widget-title">LeetCode Counter</h1>
      <p class="widget-sub">Easy, medium, hard.</p>
    </div>
    <div class="widget-actions">
      <div class="theme-toggle" id="themeToggle">
        <button class="theme-btn" type="button" data-theme="light">light</button>
        <button class="theme-btn" type="button" data-theme="dark">dark</button>
      </div>
      <button class="copy-btn" id="copyBtn">copy widget link</button>
      <span class="copy-status" id="copyStatus"></span>
    </div>
  </div>
  <section class="widget-shell">
    <div class="stack">
      <div class="row" data-key="easy">
        <div class="row-copy">
          <span class="badge easy"></span>
          <div>
            <div class="row-title">Easy</div>
            <div class="row-sub">Warm up</div>
          </div>
        </div>
        <div class="row-controls">
          <div class="count" data-count="easy">0</div>
          <div class="controls">
            <button class="btn-small" type="button" data-action="decrease" data-key="easy" aria-label="Decrease easy count">-</button>
            <button class="btn-small" type="button" data-action="increase" data-key="easy" aria-label="Increase easy count">+</button>
          </div>
        </div>
      </div>
      <div class="row" data-key="medium">
        <div class="row-copy">
          <span class="badge medium"></span>
          <div>
            <div class="row-title">Medium</div>
            <div class="row-sub">Main work</div>
          </div>
        </div>
        <div class="row-controls">
          <div class="count" data-count="medium">0</div>
          <div class="controls">
            <button class="btn-small" type="button" data-action="decrease" data-key="medium" aria-label="Decrease medium count">-</button>
            <button class="btn-small" type="button" data-action="increase" data-key="medium" aria-label="Increase medium count">+</button>
          </div>
        </div>
      </div>
      <div class="row" data-key="hard">
        <div class="row-copy">
          <span class="badge hard"></span>
          <div>
            <div class="row-title">Hard</div>
            <div class="row-sub">Stretch</div>
          </div>
        </div>
        <div class="row-controls">
          <div class="count" data-count="hard">0</div>
          <div class="controls">
            <button class="btn-small" type="button" data-action="decrease" data-key="hard" aria-label="Decrease hard count">-</button>
            <button class="btn-small" type="button" data-action="increase" data-key="hard" aria-label="Increase hard count">+</button>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="total" id="totalCount">total solved: 0</div>
      <button class="reset-btn" type="button" id="resetBtn">reset</button>
    </div>
  </section>
</main>
<script>
var STORAGE_KEY='leetcode_counter_values';
var SELECTED_THEME='light';
var THEMES={
  light:{pageBg:'#f7f6f3',bg:'#ffffff',bg2:'#f1efe8',border:'rgba(55,53,47,0.09)',t1:'#2f2c27',t2:'#6b665c',t3:'#9b968b',accent:'#caef72'},
  dark:{pageBg:'#191919',bg:'#191919',bg2:'#202020',border:'rgba(255,255,255,0.06)',t1:'#e3e3e1',t2:'#9b9a97',t3:'#5a5a5a',accent:'#caef72'}
};
var counts=getCounts();
function css(name,value){document.documentElement.style.setProperty(name,value)}
function themeChoice(){
  var q=new URLSearchParams(window.location.search).get('theme');
  if(q==='light'||q==='dark')return q;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function syncThemeButtons(){
  document.querySelectorAll('.theme-btn').forEach(function(btn){
    btn.classList.toggle('active',btn.dataset.theme===SELECTED_THEME);
  });
}
function setThemeQuery(theme){
  var params=new URLSearchParams(window.location.search);
  params.set('theme',theme);
  var query=params.toString();
  history.replaceState(null,'',window.location.pathname+(query?'?'+query:''));
}
function applyTheme(theme){
  var active=THEMES[theme||themeChoice()]||THEMES.light;
  SELECTED_THEME=theme||themeChoice();
  css('--page-bg',active.pageBg);
  css('--bg',active.bg);
  css('--bg2',active.bg2);
  css('--border',active.border);
  css('--t1',active.t1);
  css('--t2',active.t2);
  css('--t3',active.t3);
  css('--accent',active.accent);
  syncThemeButtons();
}
function isEmbedMode(){
  var q=new URLSearchParams(window.location.search).get('embed');
  if(q==='1'||q==='true')return true;
  try{return window.self!==window.top;}catch(e){return true;}
}
function applyEmbedMode(){
  if(isEmbedMode())document.body.classList.add('embed-mode');
}
function copyStatus(msg){
  var el=document.getElementById('copyStatus');
  el.textContent=msg;
  window.clearTimeout(copyStatus.t);
  copyStatus.t=window.setTimeout(function(){el.textContent='';},1800);
}
function currentWidgetUrl(){
  var params=new URLSearchParams(window.location.search);
  params.set('embed','1');
  params.set('theme',SELECTED_THEME);
  var query=params.toString();
  return window.location.origin+window.location.pathname+(query?'?'+query:'');
}
function copyLink(){
  var text=currentWidgetUrl();
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){copyStatus('widget link copied');},function(){copyStatus('copy failed');});
    return;
  }
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='absolute';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');copyStatus('widget link copied');}
  catch(e){copyStatus('copy failed');}
  document.body.removeChild(ta);
}
function getCounts(){
  try{
    var raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    return {
      easy:Number.isFinite(raw.easy)?Math.max(0,raw.easy):0,
      medium:Number.isFinite(raw.medium)?Math.max(0,raw.medium):0,
      hard:Number.isFinite(raw.hard)?Math.max(0,raw.hard):0
    };
  }catch(e){
    return {easy:0,medium:0,hard:0};
  }
}
function setCounts(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(counts));
}
function render(){
  ['easy','medium','hard'].forEach(function(key){
    var node=document.querySelector('[data-count="'+key+'"]');
    if(node)node.textContent=String(counts[key]);
  });
  document.getElementById('totalCount').textContent='total solved: '+(counts.easy+counts.medium+counts.hard);
}
document.getElementById('copyBtn').onclick=copyLink;
document.querySelectorAll('.theme-btn').forEach(function(btn){
  btn.onclick=function(){
    SELECTED_THEME=btn.dataset.theme;
    setThemeQuery(SELECTED_THEME);
    applyTheme(SELECTED_THEME);
  };
});
document.querySelectorAll('[data-action]').forEach(function(btn){
  btn.onclick=function(){
    var key=btn.dataset.key;
    counts[key]=btn.dataset.action==='increase'?counts[key]+1:Math.max(0,counts[key]-1);
    setCounts();
    render();
  };
});
document.getElementById('resetBtn').onclick=function(){
  counts={easy:0,medium:0,hard:0};
  setCounts();
  render();
};
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!new URLSearchParams(window.location.search).get('theme'))applyTheme()});
}
applyEmbedMode();
applyTheme();
render();
(function(){function sendHeight(){var h=document.documentElement.scrollHeight;window.parent.postMessage({widgetHeight:h,src:location.pathname},'*');}sendHeight();new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true,attributes:true});window.addEventListener('resize',sendHeight);})();
</script>
</body>
</html>
